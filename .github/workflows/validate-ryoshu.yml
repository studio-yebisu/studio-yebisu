name: Validate Ryoshu publication
on:
  pull_request:
    paths:
      - data/cases/ryoshu-local.json
      - data/production/ryoshu-local.json
      - examples/ryoshu-local/**
      - .github/workflows/validate-ryoshu.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python scripts/build.py
      - run: python scripts/check.py
