<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Ming Image 0.1 Design 解説動画の編集用ソース（32秒・無音）｜Studio Yebisu</title>
  <script>
    // 書き出し中はプレビューの操作を出さず、画面いっぱいに1コマだけを描く。
    if (window.__MOTION_RENDER__ || /[?&]render=/.test(location.search)) document.documentElement.classList.add('is-render');
  </script>
  <link rel="stylesheet" href="../styles.css">
  <style>
    .ed-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; max-width: 1180px; margin: 0 auto; padding: 4px 8px; }
    .ed-top h1 { margin: 0; font: 800 clamp(17px, 4.8vw, 26px)/1.35 var(--serif); color: var(--forest); }
    .ed { max-width: 1180px; margin: 0 auto; padding: 0 8px 48px; }
    .screen { display: flex; justify-content: center; background: var(--faint); border-radius: 12px; padding: 8px; }
    #film { display: block; max-width: 100%; max-height: 70vh; width: auto; height: auto; background: var(--paper); box-shadow: 0 1px 0 var(--line); }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0; }
    .row button {
      min-width: 44px; min-height: 44px; padding: 0 12px; border: 1.5px solid var(--green); border-radius: 999px;
      background: var(--card); color: var(--forest); font: 700 14px/1.2 var(--sans); cursor: pointer;
    }
    .row button[aria-pressed="true"] { background: var(--forest); color: var(--card); border-color: var(--forest); }
    #ed-scrub { width: 100%; min-height: 44px; accent-color: var(--forest); margin: 0; }
    .time { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; }
    #ed-time { width: 5em; min-height: 44px; padding: 0 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font: 600 15px/1 var(--mono); }
    .state { font-size: 13.5px; color: var(--muted); margin: 6px 0; }
    body[data-state="failed"] .state { padding: 10px; border: 2px solid var(--ochre); border-radius: 10px; background: var(--warn-bg); color: var(--ink); }
    #ed-retry { background: var(--forest); color: var(--card); border-color: var(--forest); }
    .inv { font-size: 12.5px; padding-left: 1.4em; columns: 1; }
    .inv li { overflow-wrap: anywhere; }
    .inv code { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
    .note { font-size: 13px; color: var(--muted); }
    @media (min-width: 860px) { .inv { columns: 2; } }

    .is-render, .is-render body { margin: 0; padding: 0; overflow: hidden; background: var(--paper); }
    .is-render *, .is-render *::before, .is-render *::after { transition: none !important; animation: none !important; }
    .is-render .ed-top, .is-render .ed > :not(.screen) { display: none !important; }
    .is-render .ed { max-width: none; padding: 0; margin: 0; }
    .is-render .screen { padding: 0; border-radius: 0; background: none; display: block; }
    .is-render #film { width: 100vw; height: 100vh; max-width: none; max-height: none; box-shadow: none; }
  </style>
  <script type="module" src="main.js"></script>
</head>
<body data-app="ming-film" data-state="loading" data-orient="portrait">
  <header class="ed-top">
    <h1><span class="nw">Ming Image 0.1 Design 解説動画</span><span class="nw">（編集用ソース・32秒・無音）</span></h1>
    <a class="back" href="../index.html">作例へ</a>
  </header>

  <main class="ed">
    <div class="screen">
      <canvas id="film" width="720" height="1280" role="img" aria-label="Ming Image 0.1 Design の構造図の動画。原典と依頼から、作者AIが書き、制作担当が公開デモへ1回送り、モデルの中で2本の条件に分かれ、ノイズから12回で描かれ、実際のPNGが返り、字形とαを確かめて保存するまで。"></canvas>
    </div>

    <p class="state" role="status">
      <span id="ed-state-detail">保存済みの20ファイルを、大きさとSHA-256で確かめています…</span>
      <button type="button" id="ed-retry" class="ghost" hidden>もう一度確かめる</button>
    </p>

    <div class="row" role="group" aria-label="再生">
      <button type="button" id="ed-play" aria-pressed="false" disabled>再生</button>
      <button type="button" id="ed-replay" disabled>最初から再生</button>
      <button type="button" id="ed-start" disabled>先頭へ</button>
      <button type="button" id="ed-end" disabled>末尾へ</button>
      <label class="time">秒 <input id="ed-time" type="text" inputmode="decimal" value="0.0" aria-describedby="ed-time-help" disabled></label>
      <span id="ed-time-help" class="note">数字を入れて Enter</span>
    </div>
    <input id="ed-scrub" type="range" min="0" max="32" step="0.1" value="0" aria-label="時刻（秒）" disabled>

    <div class="row" role="group" aria-label="場面">
      <button type="button" data-scene="0" aria-pressed="true" disabled>1 何か</button>
      <button type="button" data-scene="1" aria-pressed="false" disabled>2 渡す</button>
      <button type="button" data-scene="2" aria-pressed="false" disabled>3 読む</button>
      <button type="button" data-scene="3" aria-pressed="false" disabled>4 分ける</button>
      <button type="button" data-scene="4" aria-pressed="false" disabled>5 描く</button>
      <button type="button" data-scene="5" aria-pressed="false" disabled>6 返る</button>
      <button type="button" data-scene="6" aria-pressed="false" disabled>7 使う</button>
    </div>

    <div class="row" role="group" aria-label="向き">
      <button type="button" data-orient="portrait" aria-pressed="true" disabled>縦 720×1280</button>
      <button type="button" data-orient="landscape" aria-pressed="false" disabled>横 1280×720</button>
    </div>

    <p class="note">音はありません（音声トラック・ナレーション・読み上げなし）。動き・粒・目盛り・時間の表示は説明の形で、測った内部の値や処理時間ではありません。画像は照合した実際のPNG 1枚だけです。ここではモデルの実行も公開デモの呼び出しもしません。</p>

    <h2>照合する素材 <span id="ed-count">0/20</span></h2>
    <ol id="ed-inventory" class="inv"></ol>
    <p class="note">書き出しの手順と読み方は <a href="README.md">video/README.md</a> にあります。</p>
  </main>
</body>
</html>
