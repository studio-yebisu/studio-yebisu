<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>解説映像のソース：Motion Video Kit の使用例（22秒・無音）</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F6F3EB; color: #17282B; }
  body { display: flex; flex-direction: column; height: 100dvh; font-family: 'Yu Gothic', 'YuGothic', 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
  #stage { display: block; flex: 1 1 0; min-height: 0; width: 100%; }
  #stage:focus-visible { outline: 3px solid #0B615E; outline-offset: -3px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 16px; font-size: 14px; border-top: 1px solid rgba(23, 40, 43, 0.14); }
  .controls input { flex: 1 1 160px; min-width: 0; accent-color: #0B615E; }
  .controls button { font: inherit; padding: 4px 14px; border: 1px solid #0B615E; border-radius: 6px; background: #FBF9F3; color: #0B615E; cursor: pointer; }
  .controls output { min-width: 5em; font-variant-numeric: tabular-nums; }
  .controls p { flex-basis: 100%; margin: 0; font-size: 12px; color: rgba(23, 40, 43, 0.72); }
  #notice { color: #8A2E16; font-weight: 700; }
  .render .controls { display: none; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" tabindex="0"
  aria-label="解説、22秒、無音。実際の入力、8つの構図の絵コンテ、本編のMP4から書き出したフレーム、別担当のAIによる確認、依頼文で試す方法を順に示す。"></svg>
<div class="controls">
  <button type="button" id="play" aria-pressed="false">再生</button>
  <label for="time">時刻</label>
  <input id="time" type="range" min="0" max="22" step="0.0333333" value="0">
  <output id="readout" for="time">0.00秒</output>
  <p id="notice" role="alert" hidden></p>
  <p>映像の上でSpaceかKで再生・一時停止、左右キーで1フレーム（Shiftで1秒）。作品の画面は本編のMP4から書き出した画像（../assets/film-XX.png）で、ページ上では何も生成しません。</p>
</div>
<script type="module">
  import { start } from './explain.mjs';
  start();
</script>
</body>
</html>
