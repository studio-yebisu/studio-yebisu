<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本編のソース：八百万図AIツールボックス サイト紹介（20秒・無音）</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F6F3EB; color: #17282B; }
  body { display: flex; flex-direction: column; height: 100dvh; font-family: 'Yu Gothic', 'YuGothic', 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
  #stage { display: block; flex: 1 1 0; min-height: 0; width: 100%; }
  #stage:focus-visible { outline: 3px solid #0B615E; outline-offset: -3px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 16px; font-size: 14px; border-top: 1px solid rgba(23, 40, 43, 0.14); }
  .controls input { flex: 1 1 160px; min-width: 0; accent-color: #0B615E; }
  .controls button, .controls select { font: inherit; padding: 4px 12px; border: 1px solid #0B615E; border-radius: 6px; background: #FBF9F3; color: #0B615E; }
  .controls button { cursor: pointer; }
  .controls select { max-width: 100%; color: #17282B; }
  .controls output { min-width: 5em; font-variant-numeric: tabular-nums; }
  .controls .hint { flex-basis: 100%; margin: 0; color: rgba(23, 40, 43, 0.72); font-size: 12px; }
  .render .controls { display: none; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" role="img" tabindex="0"
  aria-label="八百万図AIツールボックス のサイト紹介、20秒、無音。表紙のモーションのカードを囲む1本の輪郭が、紹介の一覧、作例記事の模式図、実際の依頼文、入力帯と結果をまとめた枠、依頼文をコピーのボタンを経て、作例を見るのボタンになる。紹介用に再構成した画面で、実際の操作の録画ではない。"></svg>
<div class="controls">
  <button type="button" id="play" aria-pressed="false">再生</button>
  <label for="time">時刻</label>
  <input id="time" type="range" min="0" max="20" step="0.0166667" value="0">
  <output id="readout" for="time">0.00秒</output>
  <label for="scene">場面</label>
  <select id="scene"></select>
  <p class="hint">映像の上でSpaceかKで再生・一時停止、左右キーで1フレーム（Shiftで1秒）、Home・Endで最初と最後へ。ページ上の再生は確認用で、書き出しの画は時刻だけで決まります。</p>
</div>
<script type="module">
  import { start } from './film.mjs';
  start();
</script>
</body>
</html>
