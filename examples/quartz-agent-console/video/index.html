<!doctype html>
<html lang="ja" data-state="loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quartz 図解動画の編集ソース（無音32秒）｜Yaoyorozu-AI Toolbox</title>
  <script>
    // Recording mode shows only the canvas at the composition size.
    if (window.__MOTION_RENDER__ || /[?&]render(=|&|$)/.test(location.search)) document.documentElement.classList.add('render');
  </script>
  <link rel="stylesheet" href="video.css?v=visual-r1-r2">
  <script type="module" src="video.js?v=visual-r1-r2"></script>
</head>
<body>
  <header class="top preview-only">
    <h1>Quartz 図解動画の編集ソース</h1>
    <p class="sub">無音32秒。縦 720×1280 と横 1280×720 を同じ時間割で描き分けます。表示する実行ログは3件の静的サンプルです。</p>
    <nav aria-label="関連"><a href="../index.html">図解ページへ戻る</a></nav>
  </header>

  <div class="stage" id="stage">
    <canvas id="film" width="720" height="1280" role="img" aria-label="Quartzの図解動画。指示書と依頼から同じ作者AIがコードとfixtureを書き、制作担当が別工程で確かめ、body.quartzの範囲で役割トークンと8部品が組まれ、Timelineで選んだidがAppへ戻って入力と出力が開き、JSONがブラウザーへ渡る様子を一枚の図で示します。音はありません。"></canvas>
  </div>

  <div class="panel preview-only">
    <div class="status-row">
      <p id="asset-status" data-state="loading" role="status">素材30件を確かめています</p>
      <button type="button" id="retry" hidden>もう一度読み込む</button>
      <p id="asset-dims"></p>
    </div>

    <div class="row" role="group" aria-label="画面の向き">
      <button type="button" data-orient="portrait" aria-pressed="true">縦 720×1280</button>
      <button type="button" data-orient="wide" aria-pressed="false">横 1280×720</button>
    </div>

    <div class="row" role="group" aria-label="再生">
      <button type="button" id="play" aria-pressed="false" disabled>再生</button>
      <button type="button" id="reset" disabled>最初へ</button>
      <button type="button" id="replay" disabled>最初から再生</button>
      <button type="button" id="end" disabled>最後へ</button>
    </div>

    <div class="scrub">
      <label for="time">位置（秒）</label>
      <input id="time" type="range" min="0" max="32" step="0.1" value="0" disabled>
      <output id="clock" for="time">0.0 / 32.0秒</output>
    </div>

    <ol class="jumps" aria-label="場面へ移動">
      <li><button type="button" data-jump="0" disabled>1 指示書と依頼</button></li>
      <li><button type="button" data-jump="4" disabled>2 作者と制作担当</button></li>
      <li><button type="button" data-jump="8" disabled>3 範囲とトークン</button></li>
      <li><button type="button" data-jump="14" disabled>4 idがAppへ戻る</button></li>
      <li><button type="button" data-jump="20" disabled>5 入力と出力</button></li>
      <li><button type="button" data-jump="26" disabled>6 JSONと実物</button></li>
      <li><button type="button" data-jump="29" disabled>7 全体</button></li>
    </ol>

    <p class="note">ここでの再生と移動は確認用の操作で、書き出す映像には入りません。<code>window.seek(秒)</code> はどの時刻でも、前の描画に頼らずその時刻の一枚を描き直します。素材30件の大きさとSHA-256、2枚の撮影画像の復号を確かめるまで描画しません。</p>
  </div>
</body>
</html>
