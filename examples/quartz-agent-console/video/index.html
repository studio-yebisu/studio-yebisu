<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quartz の使い方｜解説動画のソース｜Studio Yebisu</title>
  <script>
    // Recording mode: show only the canvas, at the composition size.
    if (window.__MOTION_RENDER__ || /[?&]render(=|&|$)/.test(location.search)) document.documentElement.classList.add('render');
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: #f2eee3; color: #17150f;
      font: 16px/1.8 "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, "Noto Sans JP", sans-serif;
    }
    canvas { display: block; }

    html.render, html.render body { width: 100%; height: 100%; overflow: hidden; }
    html.render .page { max-width: none; margin: 0; padding: 0; }
    html.render .frame { border: 0; }
    html.render canvas, html.render .frame canvas { width: 100vw; height: 100vh; }
    html.render .preview-only { display: none !important; }

    .page { max-width: 1320px; margin: 0 auto; padding: 1.25rem clamp(1rem, 3vw, 2rem) 2.5rem; }
    .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid #17150f; margin-bottom: 1.25rem; font-size: 0.9375rem; }
    .top a { color: inherit; text-underline-offset: 0.2em; }
    h1 { margin: 0; font: 700 1.375rem/1.4 "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
    .frame { border: 1px solid #17150f; }
    .frame canvas { width: 100%; height: auto; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1rem; padding: 0.75rem 0; border-bottom: 1px solid rgba(23, 21, 15, 0.22); }
    .controls button { font: inherit; font-weight: 700; min-height: 2.75rem; padding: 0.35rem 1.1rem; border: 1px solid #17150f; background: #17150f; color: #f2eee3; border-radius: 0; cursor: pointer; }
    .controls input[type="range"] { flex: 1 1 14rem; accent-color: #ff4f00; min-height: 2.75rem; }
    .controls output { font-variant-numeric: tabular-nums; min-width: 6.5em; }
    .chapters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.75rem 0 0; padding: 0; list-style: none; }
    .chapters button { font: inherit; font-size: 0.9375rem; min-height: 2.5rem; padding: 0.25rem 0.85rem; border: 1px solid #17150f; background: transparent; color: inherit; border-radius: 0; cursor: pointer; }
    .chapters button:hover { background: #17150f; color: #f2eee3; }
    .note { margin: 1rem 0 0; font-size: 0.875rem; color: #4f4a3f; max-width: 46em; }
    :focus-visible { outline: 3px solid #17150f; outline-offset: 3px; box-shadow: 0 0 0 3px #cbef3a; }
  </style>
</head>
<body>
  <div class="page">
    <header class="top preview-only">
      <h1>Quartz の使い方（解説動画のソース）</h1>
      <nav aria-label="関連"><a href="../index.html">作例を開く</a>　<a href="../../../case.html?id=quartz-agent-console">作例の記事</a></nav>
    </header>
    <div class="frame">
      <canvas id="scene" role="img" aria-label="Quartzの紹介から始まり、使った部品とSKILLの規則、3件のサンプル実行ログ、ツールが失敗した段とその入力・出力を、実際の作例画面の撮影をズームして示し、作例を触って確かめるよう案内する28秒の解説動画"></canvas>
    </div>
    <div class="controls preview-only" id="controls">
      <button type="button" id="play" aria-pressed="false">再生</button>
      <input id="scrub" type="range" min="0" max="28" step="0.0333" value="0" aria-label="再生位置（秒）">
      <output id="time" for="scrub">0.00 / 28.00秒</output>
    </div>
    <ol class="chapters preview-only" aria-label="場面へ移動">
      <li><button type="button" data-at="2.5">1 Quartz</button></li>
      <li><button type="button" data-at="7.5">2 部品</button></li>
      <li><button type="button" data-at="12">3 ログ</button></li>
      <li><button type="button" data-at="15.5">4 止まった段</button></li>
      <li><button type="button" data-at="20.5">5 入力と出力</button></li>
      <li><button type="button" data-at="25.5">6 作例</button></li>
    </ol>
    <p class="note preview-only">1280×720、30fps、28秒、音声なし。画面の場面は、この作例を撮影した screenshot-light.png と screenshot-fail.png をズームして見せています。このページの再生と移動は確認用の操作で、書き出す映像には含まれません。どの時刻を指定しても、その時刻の画面だけを描き直します。</p>
  </div>
  <script src="scene.js"></script>
  <script>
    (() => {
      if (document.documentElement.classList.contains('render')) {
        for (const el of document.querySelectorAll('.preview-only')) el.remove();
        return;
      }
      const duration = window.motionConfig.duration;
      const play = document.getElementById('play'), scrub = document.getElementById('scrub'), output = document.getElementById('time');
      let playing = false, seconds = 0, start = 0, raf = 0;
      function draw(t) {
        seconds = Math.max(0, Math.min(duration, t));
        window.seek(seconds);
        scrub.value = String(seconds);
        output.value = seconds.toFixed(2) + ' / ' + duration.toFixed(2) + '秒';
      }
      function stop() {
        playing = false;
        cancelAnimationFrame(raf);
        play.textContent = seconds >= duration ? 'もう一度再生' : '再生';
        play.setAttribute('aria-pressed', 'false');
      }
      function tick(now) {
        if (!playing) return;
        const t = (now - start) / 1000;
        if (t >= duration) { draw(duration); stop(); return; }
        draw(t);
        raf = requestAnimationFrame(tick);
      }
      play.addEventListener('click', () => {
        if (playing) return stop();
        if (seconds >= duration) seconds = 0;
        playing = true;
        start = performance.now() - seconds * 1000;
        play.textContent = '一時停止';
        play.setAttribute('aria-pressed', 'true');
        raf = requestAnimationFrame(tick);
      });
      scrub.addEventListener('input', () => { stop(); draw(Number(scrub.value)); });
      for (const button of document.querySelectorAll('[data-at]')) {
        button.addEventListener('click', () => { stop(); draw(Number(button.dataset.at)); });
      }
      document.addEventListener('visibilitychange', () => { if (document.hidden && playing) stop(); });
      draw(0);
    })();
  </script>
</body>
</html>
