<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>編集できる動画ソース｜1件だけ進めて、続きはファイルへ。｜八百万図AIツールボックス</title>
<script>if (window.__MOTION_RENDER__ === true) document.documentElement.classList.add('render');</script>
<link rel="stylesheet" href="video.css">
</head>
<body>
<main class="pv">
  <header class="pv-head">
    <a class="pv-back" href="../index.html">← 作例の図</a>
    <h1>動画ソース：1件だけ進めて、続きはファイルへ。</h1>
    <p class="pv-note">無音・32秒。1枚の図の中で、同じファイルとカードが動きます。再生は押したときだけ始まります。</p>
    <nav class="pv-layout" aria-label="画面の向き">
      <a id="lay-portrait" href="index.html">縦 720×1280</a>
      <a id="lay-wide" href="index.html?layout=wide">横 1280×720</a>
    </nav>
  </header>

  <div class="stage">
    <canvas id="film" role="img" aria-label="Harness Creatorの5つのファイルで、1件の作業が制作担当の検証を通り、フォルダーに入って新しいセッションへ渡る無音の図解動画"></canvas>
    <div id="film-error" class="film-error" role="alert" hidden>
      <p class="fe-title">動画の素材を確かめられませんでした</p>
      <p id="film-error-text" class="fe-text"></p>
      <p class="fe-hint">代わりのデータは使いません。</p>
      <button type="button" id="film-retry" class="pv-btn">もう一度読み込む</button>
    </div>
  </div>

  <div class="pv-controls">
    <div class="pv-row">
      <button type="button" id="play" class="pv-btn pv-main" disabled>再生</button>
      <button type="button" id="replay" class="pv-btn" disabled>最初から再生</button>
      <button type="button" id="to-start" class="pv-btn" disabled>先頭へ</button>
      <button type="button" id="to-end" class="pv-btn" disabled>最後へ</button>
      <output id="time" class="pv-time" for="scrub">0.00 / 32.00 秒</output>
    </div>
    <label for="scrub" class="visually-hidden">再生位置（秒）</label>
    <input id="scrub" class="pv-scrub" type="range" min="0" max="32" step="0.001" value="0" disabled>
    <div id="scenes" class="pv-scenes" role="group" aria-label="場面へ移動"></div>
    <p id="film-status" class="pv-status" role="status" aria-live="polite">素材10件を読み込み、SHA-256を確かめています…</p>
  </div>
</main>
<script src="video.js"></script>
</body>
</html>
