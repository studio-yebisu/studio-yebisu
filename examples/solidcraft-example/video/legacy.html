<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
  <title>解説動画のソース：寸法を4つ変えても、穴は中央、壁は3 mmのまま</title>
  <style>
    :root {
      --paper: #f2eee3;
      --paper-deep: #e7e1d0;
      --ink: #17150f;
      --ink-soft: #4f4a3f;
      --orange: #ff4f00;
      --orange-text: #a83500;
      --mincho: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "BIZ UDPMincho", "Noto Serif JP", serif;
      --gothic: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "YuGothic", "Meiryo", "Noto Sans JP", sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Consolas, "BIZ UDGothic", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #d9d3c2; color: var(--ink); font-family: var(--gothic); }
    body.render { width: auto; height: auto; overflow: hidden; background: var(--paper); }
    .viewport { display: flex; justify-content: center; padding: 16px 16px 0; overflow: hidden; }
    .render .viewport { padding: 0; display: block; }
    .stage-holder { position: relative; overflow: hidden; }
    .stage { position: absolute; left: 0; top: 0; overflow: hidden; background: var(--paper); transform-origin: 0 0; }
    .box { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    .wide .box { width: 1280px; height: 720px; }
    .tall .box { width: 720px; height: 1280px; }
    .el { position: absolute; visibility: hidden; opacity: 0; }
    .flow > .el, .row-el { position: relative; }

    .hdr { font-size: 24px; color: var(--ink-soft); white-space: nowrap; }
    .wide .hdr { left: 64px; top: 34px; }
    .tall .hdr { left: 40px; top: 48px; }
    .hdr b { color: var(--ink); font-weight: 700; }
    .progress { position: absolute; left: 0; bottom: 0; width: 100%; height: 6px; background: var(--orange); transform-origin: 0 0; visibility: visible; opacity: 1; }

    /* 1：題と目的 */
    .titleblock { position: absolute; }
    .wide .titleblock { left: 96px; top: 150px; width: 1088px; }
    .tall .titleblock { left: 40px; top: 360px; width: 640px; }
    .t-rule { width: 120px; height: 6px; background: var(--orange); margin-bottom: 26px; }
    .t-kicker { font-size: 28px; font-weight: 700; color: var(--orange-text); margin-bottom: 18px; }
    .t-line { font-family: var(--mincho); font-weight: 700; line-height: 1.22; white-space: nowrap; letter-spacing: -0.01em; }
    .wide .t-line { font-size: 88px; }
    .tall .t-line { font-size: 58px; }
    .t-purpose { margin-top: 34px; font-size: 30px; line-height: 1.6; }

    /* 画像の枠（2〜4） */
    .frame { box-shadow: 0 0 0 1px var(--ink); background: #e9edf2; overflow: hidden; }
    .wide .frame { left: 64px; top: 104px; width: 704px; height: 528px; }
    .tall .frame { left: 40px; top: 130px; width: 640px; height: 480px; }
    .frame img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
    .mark { position: absolute; pointer-events: none; }
    .ring { border: 4px solid var(--orange); border-radius: 50%; }
    .wallbox { border: 3px solid var(--orange); }
    .chip { position: absolute; font-size: 24px; font-weight: 700; line-height: 1; padding: 6px 10px; background: var(--paper); border: 2px solid var(--orange); color: var(--ink); white-space: nowrap; }
    .cap { font-size: 24px; line-height: 1.5; color: var(--ink-soft); }
    .wide .cap { left: 64px; top: 646px; width: 704px; }
    .tall .cap { left: 40px; top: 1160px; width: 640px; }

    /* 右（縦長では下）の文字の欄 */
    .col { position: absolute; }
    .wide .col { left: 808px; top: 112px; width: 424px; }
    .tall .col { left: 40px; top: 650px; width: 640px; }
    .label { font-size: 32px; font-weight: 700; color: var(--orange-text); line-height: 1.4; margin-bottom: 10px; }
    .dims { font-family: var(--mincho); font-weight: 700; font-size: 52px; line-height: 1.25; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .unit { font-size: 24px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 26px; }
    .big { font-family: var(--mincho); font-weight: 700; font-size: 44px; line-height: 1.4; }
    .big small { font-family: var(--gothic); font-size: 28px; font-weight: 700; color: var(--ink-soft); margin-right: 14px; }
    .prow { display: grid; grid-template-columns: 92px auto 40px auto; align-items: baseline; column-gap: 8px; height: 62px; border-bottom: 1px solid rgba(23,21,15,.22); }
    .prow .n { font-size: 28px; font-weight: 700; }
    .prow .b { font-size: 30px; color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums; }
    .prow .ar { font-size: 28px; color: var(--orange-text); text-align: center; }
    .prow .a { font-family: var(--mincho); font-size: 40px; font-weight: 700; color: var(--orange-text); font-variant-numeric: tabular-nums; }
    .prow .a small { font-family: var(--gothic); font-size: 24px; color: var(--ink-soft); margin-left: 6px; }
    .note { margin-top: 24px; font-size: 26px; line-height: 1.55; }
    .note code { font-family: var(--mono); font-size: 25px; background: var(--paper-deep); padding: 0 6px; }
    .check { padding: 14px 0 16px; border-top: 2px solid var(--ink); }
    .check + .check { border-top-width: 1px; border-top-color: rgba(23,21,15,.3); }
    .check .m { font-size: 32px; font-weight: 700; line-height: 1.4; font-variant-numeric: tabular-nums; }
    .check .m::before { content: "✓ "; color: var(--orange-text); }
    .check .s { font-size: 24px; line-height: 1.5; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

    /* 5：保存したもの */
    .filesblock { position: absolute; }
    .wide .filesblock { left: 96px; top: 92px; width: 1088px; }
    .tall .filesblock { left: 40px; top: 150px; width: 640px; }
    .f-title { font-family: var(--mincho); font-weight: 700; font-size: 56px; line-height: 1.3; margin-bottom: 30px; }
    .frow { border-top: 2px solid var(--ink); padding: 22px 0 24px; }
    .frow.last { border-bottom: 2px solid var(--ink); }
    .wide .frow { display: grid; grid-template-columns: 380px 1fr; column-gap: 24px; align-items: center; }
    .f-kind { font-family: var(--mincho); font-weight: 700; font-size: 38px; line-height: 1.3; }
    .f-kind small { display: block; font-family: var(--gothic); font-weight: 400; font-size: 24px; color: var(--ink-soft); line-height: 1.5; }
    .f-names { font-family: var(--mono); font-size: 26px; line-height: 1.6; }
    .f-names span { display: inline-block; margin-right: 28px; }
    .tall .f-names { margin-top: 10px; }
    .tall .f-names span { display: block; }
    .f-foot { margin-top: 30px; font-size: 24px; color: var(--ink-soft); line-height: 1.5; }

    .failure { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 48px; font-size: 28px; text-align: center; background: var(--paper); color: #8f1d00; font-weight: 700; }

    /* プレビューの操作（書き出しでは出さない） */
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; max-width: 1280px; margin: 12px auto 20px; padding: 12px 16px; background: var(--paper); border: 1px solid var(--ink); font-size: 15px; }
    .controls button { font: inherit; font-weight: 700; min-height: 40px; padding: 6px 14px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; }
    .controls button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    .controls button:focus-visible, .controls input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    .controls input[type="range"] { flex: 1 1 260px; min-width: 160px; accent-color: var(--orange); }
    .controls output { font-variant-numeric: tabular-nums; min-width: 4.5em; }
    .chapters { display: flex; flex-wrap: wrap; gap: 6px; }
    .controls .hint { flex-basis: 100%; color: var(--ink-soft); margin: 0; }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="stage-holder" id="holder">
      <div class="stage" id="stage" role="img" aria-label="解説動画：架空の小物トレーを SolidCraft で作り、寸法を4つ変えて計算し直し、上から確かめ、設計・STEP・STLで保存するまで。">
        <div class="box" id="box"></div>
      </div>
    </div>
  </div>
  <div class="controls" id="controls" hidden>
    <button type="button" id="play" aria-pressed="false">再生</button>
    <input type="range" id="scrub" min="0" max="28" step="0.0333333" value="0" aria-label="時刻（秒）">
    <output id="time" for="scrub">0.00秒</output>
    <div class="chapters" role="group" aria-label="場面へ移動">
      <button type="button" data-at="0">1 目的</button>
      <button type="button" data-at="4">2 初期</button>
      <button type="button" data-at="9">3 変更</button>
      <button type="button" data-at="15">4 確認</button>
      <button type="button" data-at="23">5 保存</button>
    </div>
    <p class="hint">プレビューです。書き出しでは、この操作の欄は表示しません。画像と数値は作例の保存結果から読み込みます。</p>
  </div>

  <script>
  (() => {
    'use strict';

    const RENDER = Boolean(window.__MOTION_RENDER__) || new URLSearchParams(location.search).has('render');
    const given = window.renderConfig || {};
    const pick = (value, fallback) => (Number.isFinite(value) && value > 0 ? value : fallback);
    const W = Math.round(pick(given.width, 1280));
    const H = Math.round(pick(given.height, 720));
    const FPS = Math.round(pick(given.fps, 30));
    const DURATION = 28;

    window.motionConfig = {duration: DURATION, fps: FPS, width: W, height: H, posterTime: 12, audioEvents: []};

    const TALL = H > W;
    const BASE_W = TALL ? 720 : 1280;
    const BASE_H = TALL ? 1280 : 720;
    const SCALE = Math.min(W / BASE_W, H / BASE_H);
    const FRAME_W = TALL ? 640 : 704;

    const holder = document.getElementById('holder');
    const stage = document.getElementById('stage');
    const box = document.getElementById('box');
    if (RENDER) document.body.classList.add('render');
    stage.classList.add(TALL ? 'tall' : 'wide');
    stage.style.width = W + 'px';
    stage.style.height = H + 'px';
    box.style.transform = 'translate(' + ((W - BASE_W * SCALE) / 2) + 'px,' + ((H - BASE_H * SCALE) / 2) + 'px) scale(' + SCALE + ')';

    function fitPreview() {
      if (RENDER) {
        holder.style.width = W + 'px';
        holder.style.height = H + 'px';
        stage.style.transform = 'none';
        return;
      }
      const controls = document.getElementById('controls');
      const room = Math.max(160, innerHeight - (controls.offsetHeight || 120) - 48);
      const k = Math.min(1, (innerWidth - 32) / W, room / H);
      holder.style.width = Math.floor(W * k) + 'px';
      holder.style.height = Math.floor(H * k) + 'px';
      stage.style.transform = 'scale(' + k + ')';
    }

    // ---- 部品 ----
    const tracks = [];
    function node(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text != null) element.textContent = text;
      return element;
    }
    // a0〜a1 で入り、b0〜b1 で出る。時刻だけから状態を決める。
    function track(element, a0, a1, b0, b1, dy) {
      element.classList.add('el');
      tracks.push({element, a0, a1, b0: b0 == null ? Infinity : b0, b1: b1 == null ? Infinity : b1, dy: dy == null ? 16 : dy});
      return element;
    }
    const clamp01 = v => (v < 0 ? 0 : v > 1 ? 1 : v);
    const ease = v => 1 - Math.pow(1 - v, 3);

    // ---- 数値の表示 ----
    const len = v => {
      const r = Math.round(v);
      return Math.abs(v - r) < 1e-9 ? String(r) : v.toFixed(2);
    };
    const grouped = (v, d) => v.toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
    const basename = p => p.split('/').pop();

    function validate(data) {
      const fail = message => { throw new Error('measurements.json: ' + message); };
      if (!data || !data.states) fail('states がありません');
      for (const key of ['default', 'resized']) {
        const s = data.states[key];
        if (!s || !s.parameters || !s.fixed_parameters || !s.measured || !s.measured.bbox || !s.expected) fail(key + ' の記録が足りません');
        for (const name of ['width', 'depth', 'height', 'hole_diameter']) if (!Number.isFinite(s.parameters[name])) fail(key + '.' + name);
        if (!Number.isFinite(s.fixed_parameters.wall) || !Number.isFinite(s.fixed_parameters.floor_thickness)) fail(key + ' の壁・底');
        if (!Number.isFinite(s.measured.volume_mm3) || !Number.isFinite(s.expected.volume_mm3)) fail(key + ' の体積');
        const f = data.files && data.files[key];
        if (!f) fail(key + ' のファイル');
        for (const kind of ['design', 'step', 'stl', 'iso', 'top']) {
          if (typeof f[kind] !== 'string' || !/^(outputs|renders)\/[A-Za-z0-9._-]+$/.test(f[kind])) fail(key + '.' + kind + ' のパス');
        }
      }
      const top = data.top_image_checks && data.top_image_checks.resized;
      if (!top || !Array.isArray(top.dark_outline_x_px) || top.dark_outline_x_px.length !== 6 || !Array.isArray(top.dark_outline_y_px) || top.dark_outline_y_px.length !== 6) fail('上面の画像の線の位置');
      if (!Array.isArray(top.size) || top.size[0] !== 1280 || top.size[1] !== 960) fail('上面の画像の大きさ');
      if (!Number.isFinite(top.hole_center_vs_outer_center_within_px) || !Number.isFinite(top.hole_diameter_and_wall_thickness_error_below_mm)) fail('上面の確認の値');
      const summary = data.regression && data.regression.summary;
      if (!summary || !Number.isFinite(summary.cases) || !Number.isFinite(summary.passed)) fail('範囲の端の往復の結果');
      return data;
    }

    function loadImage(path) {
      const image = new Image();
      image.decoding = 'sync';
      image.alt = '';
      image.src = '../' + path;
      return image.decode().then(() => {
        if (image.naturalWidth !== 1280 || image.naturalHeight !== 960) throw new Error(path + ' の大きさが 1280×960 ではありません');
        return image;
      }, () => { throw new Error(path + ' を読み込めません'); });
    }

    function frameWith(image) {
      const frame = node('div', 'frame');
      frame.append(image);
      return frame;
    }

    function build(data, images) {
      const d = data.states.default;
      const r = data.states.resized;
      const wall = d.fixed_parameters.wall;
      const floor = d.fixed_parameters.floor_thickness;
      const size = s => [0, 1, 2].map(i => len(s.measured.bbox.max[i] - s.measured.bbox.min[i])).join(' × ');

      // 見出し（2場面目から）と進み具合
      const hdr = node('div', 'hdr');
      hdr.append(node('b', '', 'SolidCraft 0.11.1'), document.createTextNode(' の作例｜架空の小物トレー'));
      box.append(track(hdr, 4.0, 4.4, null, null, 0));
      const progress = node('div', 'progress');
      box.append(progress);

      // 1. 0〜4秒：何をする作例か
      const t1 = node('div', 'titleblock');
      t1.append(
        track(node('div', 't-rule'), 0.1, 0.5, 3.6, 4.0, 0),
        track(node('div', 't-kicker', '架空の小物トレー × SolidCraft 0.11.1'), 0.2, 0.7, 3.6, 4.0),
        track(node('div', 't-line', '寸法を4つ変えても、'), 0.35, 1.0, 3.6, 4.0, 24),
        track(node('div', 't-line', '穴は中央、壁は' + len(wall) + ' mm'), 0.6, 1.25, 3.6, 4.0, 24),
        track(node('div', 't-purpose', '名前の付いた寸法を変え、CADで計算し直し、実測して保存する'), 1.2, 1.8, 3.6, 4.0));
      t1.querySelectorAll('.el').forEach(e => e.classList.add('row-el'));
      box.append(t1);

      // 2. 4〜9秒：初期のトレー
      box.append(track(frameWith(images.defaultIso), 4.0, 4.6, 8.6, 9.0, 12));
      const c2 = node('div', 'col');
      const hole2 = node('div', 'big'); hole2.append(node('small', '', '穴'), document.createTextNode(len(d.parameters.hole_diameter) + ' mm'));
      const wall2 = node('div', 'big');
      wall2.append(node('small', '', wall === floor ? '壁・底' : '壁'), document.createTextNode(len(wall) + ' mm'));
      c2.append(
        track(node('div', 'label', '初期'), 4.4, 4.9, 8.6, 9.0),
        track(node('div', 'dims', size(d)), 4.7, 5.3, 8.6, 9.0),
        track(node('div', 'unit', 'mm（幅 × 奥行 × 高さ）'), 4.9, 5.4, 8.6, 9.0),
        track(hole2, 5.4, 6.0, 8.6, 9.0),
        track(wall2, 5.9, 6.5, 8.6, 9.0));
      c2.querySelectorAll('.el').forEach(e => e.classList.add('row-el'));
      box.append(c2);
      box.append(track(node('div', 'cap', 'SolidCraft で描画した画像そのまま（等角）'), 4.8, 5.4, 8.6, 9.0, 0));

      // 3. 9〜15秒：4つの寸法を変えた
      box.append(track(frameWith(images.resizedIso), 9.0, 9.6, 14.6, 15.0, 12));
      const c3 = node('div', 'col');
      c3.append(track(node('div', 'label', '変更後'), 9.2, 9.7, 14.6, 15.0));
      const names = [['width', '幅'], ['depth', '奥行'], ['height', '高さ'], ['hole_diameter', '穴径']];
      names.forEach(([key, label], i) => {
        const row = node('div', 'prow');
        const after = node('span', 'a', len(r.parameters[key]));
        after.append(node('small', '', 'mm'));
        row.append(node('span', 'n', label), node('span', 'b', len(d.parameters[key])), node('span', 'ar', '→'), after);
        c3.append(track(row, 9.6 + i * 0.4, 10.1 + i * 0.4, 14.6, 15.0, 10));
      });
      const note = node('div', 'note');
      note.append(node('code', '', 'parameters.change'), document.createTextNode(' を4つ、1回で送った。形は作り直していない'));
      c3.append(track(note, 11.3, 11.8, 14.6, 15.0));
      c3.querySelectorAll('.el').forEach(e => e.classList.add('row-el'));
      box.append(c3);
      box.append(track(node('div', 'cap', '画像は別々に枠へ収めたもの。大きさは数値で比べる'), 11.6, 12.0, 14.6, 15.0, 0));

      // 4. 15〜23秒：上から確かめた（印の位置は画像の線の位置の記録から）
      const top = data.top_image_checks.resized;
      const k = FRAME_W / top.size[0];
      const xs = top.dark_outline_x_px, ys = top.dark_outline_y_px;
      const frame4 = frameWith(images.resizedTop);
      const cx = (xs[2] + xs[3]) / 2 * k, cy = (ys[2] + ys[3]) / 2 * k;
      const rad = (xs[3] - xs[2]) / 2 * k + 12;
      const ring = node('div', 'mark ring');
      Object.assign(ring.style, {left: (cx - rad) + 'px', top: (cy - rad) + 'px', width: (rad * 2) + 'px', height: (rad * 2) + 'px'});
      const wx0 = xs[0] * k - 3, wx1 = xs[1] * k + 3;
      const wallBox = node('div', 'mark wallbox');
      Object.assign(wallBox.style, {left: wx0 + 'px', top: (cy - 64) + 'px', width: (wx1 - wx0) + 'px', height: '128px'});
      const chip = node('div', 'chip', len(wall) + ' mm');
      Object.assign(chip.style, {right: (FRAME_W - wx0 + 10) + 'px', top: (cy - 20) + 'px'});
      frame4.append(track(ring, 15.9, 16.4, null, null, 0), track(wallBox, 17.4, 17.9, null, null, 0), track(chip, 17.5, 18.0, null, null, 0));
      box.append(track(frame4, 15.0, 15.6, 22.6, 23.0, 12));

      const c4 = node('div', 'col');
      c4.append(track(node('div', 'label', '変更後・上から'), 15.2, 15.7, 22.6, 23.0));
      const check = (main, sub) => {
        const row = node('div', 'check');
        row.append(node('div', 'm', main), node('div', 's', sub));
        return row;
      };
      const rel = Math.abs(r.measured.volume_mm3 - r.expected.volume_mm3) / Math.abs(r.expected.volume_mm3) * 100;
      c4.append(
        track(check('穴は中央', '穴の中心と外形の中心が' + top.hole_center_vs_outer_center_within_px + 'ピクセル以内'), 16.2, 16.8, 22.6, 23.0),
        track(check((wall === floor ? '壁・底は' : '壁は') + len(wall) + ' mm', '壁厚の画像測定の誤差は' + top.hole_diameter_and_wall_thickness_error_below_mm + ' mm未満'), 17.6, 18.2, 22.6, 23.0),
        track(check('体積 ' + grouped(r.measured.volume_mm3, 2) + ' mm³', '解析値 ' + grouped(r.expected.volume_mm3, 2) + ' mm³ との差 ' + rel.toFixed(5) + ' %'), 19.0, 19.6, 22.6, 23.0));
      c4.querySelectorAll('.el').forEach(e => e.classList.add('row-el'));
      box.append(c4);
      const summary = data.regression.summary;
      box.append(track(node('div', 'cap', '確かめたのは範囲の端と初期値の' + summary.cases + '状態だけ（' + summary.passed + '合格）'), 20.4, 21.0, 22.6, 23.0, 0));

      // 5. 23〜28秒：保存したもの（24.5秒までに止まる）
      const f5 = node('div', 'filesblock');
      f5.append(track(node('div', 'f-title', '保存したもの'), 23.0, 23.5));
      const rows = [
        ['編集できる設計', '寸法の式とタイムラインが残る', 'design'],
        ['STEP', 'ほかの CAD への受け渡し', 'step'],
        ['STL', '三角形に分けた形', 'stl']
      ];
      rows.forEach(([kind, sub, file], i) => {
        const row = node('div', i === rows.length - 1 ? 'frow last' : 'frow');
        const label = node('div', 'f-kind', kind);
        label.append(node('small', '', sub));
        const files = node('div', 'f-names');
        files.append(node('span', '', basename(data.files.default[file])), node('span', '', basename(data.files.resized[file])));
        row.append(label, files);
        f5.append(track(row, 23.3 + i * 0.3, 23.8 + i * 0.3));
      });
      f5.append(track(node('div', 'f-foot', '製造・強度・3Dプリントの品質は確かめていません'), 24.0, 24.5));
      f5.querySelectorAll('.el').forEach(e => e.classList.add('row-el'));
      box.append(f5);

      return progress;
    }

    // ---- 時刻からの描画 ----
    let progressBar = null;
    let built = false;
    function draw(seconds) {
      const t = Math.min(DURATION, Math.max(0, Number(seconds) || 0));
      for (const item of tracks) {
        const vin = ease(clamp01((t - item.a0) / (item.a1 - item.a0)));
        const vout = item.b0 === Infinity ? 0 : ease(clamp01((t - item.b0) / (item.b1 - item.b0)));
        const opacity = vin * (1 - vout);
        const shift = (1 - vin) * item.dy - vout * item.dy * 0.5;
        item.element.style.opacity = opacity.toFixed(4);
        item.element.style.transform = shift ? 'translateY(' + shift.toFixed(2) + 'px)' : 'none';
        item.element.style.visibility = opacity > 0.0005 ? 'visible' : 'hidden';
      }
      if (progressBar) progressBar.style.transform = 'scaleX(' + (t / DURATION).toFixed(5) + ')';
    }
    window.seek = seconds => {
      if (built) draw(seconds);
    };

    window.motionReady = (async () => {
      const response = await fetch('../measurements.json', {cache: 'no-store'});
      if (!response.ok) throw new Error('measurements.json を読み込めません（HTTP ' + response.status + '）');
      const data = validate(await response.json());
      const [defaultIso, defaultTop, resizedIso, resizedTop] = await Promise.all([
        loadImage(data.files.default.iso), loadImage(data.files.default.top),
        loadImage(data.files.resized.iso), loadImage(data.files.resized.top)
      ]);
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      progressBar = build(data, {defaultIso, defaultTop, resizedIso, resizedTop});
      built = true;
      draw(0);
    })();

    fitPreview();
    if (RENDER) {
      document.getElementById('controls').remove();
      window.motionReady.catch(error => {
        const failure = node('div', 'failure', '素材を読み込めなかったため描画しません：' + error.message);
        stage.append(failure);
      });
      return;
    }

    // ---- プレビュー（書き出しには使わない） ----
    const controls = document.getElementById('controls');
    const play = document.getElementById('play');
    const scrub = document.getElementById('scrub');
    const output = document.getElementById('time');
    controls.hidden = false;
    fitPreview();
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    let playing = false, current = 0, started = 0, frame = 0;
    function show(t) {
      current = t;
      draw(t);
      scrub.value = String(t);
      output.value = t.toFixed(2) + '秒';
    }
    function stop() {
      playing = false;
      cancelAnimationFrame(frame);
      play.textContent = '再生';
      play.setAttribute('aria-pressed', 'false');
    }
    function tick(now) {
      if (!playing) return;
      const t = (now - started) / 1000;
      if (t >= DURATION) { show(DURATION); stop(); return; }
      show(t);
      frame = requestAnimationFrame(tick);
    }
    function start() {
      if (current >= DURATION - 0.01) current = 0;
      playing = true;
      started = performance.now() - current * 1000;
      play.textContent = '一時停止';
      play.setAttribute('aria-pressed', 'true');
      frame = requestAnimationFrame(tick);
    }
    play.addEventListener('click', () => (playing ? stop() : start()));
    scrub.addEventListener('input', () => { stop(); show(Number(scrub.value)); });
    controls.querySelectorAll('[data-at]').forEach(button => button.addEventListener('click', () => { stop(); show(Number(button.dataset.at)); }));
    document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });
    reduce.addEventListener('change', () => { if (reduce.matches) stop(); });
    window.addEventListener('resize', fitPreview);

    window.motionReady.then(() => {
      if (reduce.matches) show(window.motionConfig.posterTime);
      else { show(0); start(); }
    }, error => {
      play.disabled = true;
      scrub.disabled = true;
      stage.append(node('div', 'failure', '素材を読み込めなかったため描画しません：' + error.message));
    });
  })();
  </script>
</body>
</html>
