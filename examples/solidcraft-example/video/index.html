<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; font-src 'self'; media-src 'none'; base-uri 'self'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>編集用ソース：SolidCraft の構造図（無音32秒）｜Yaoyorozu-AI Toolbox</title>
  <link rel="stylesheet" href="video.css?v=visual-r1">
  <script type="module" src="video.js?v=visual-r1"></script>
</head>
<body>
  <main class="preview">
    <div class="stage" id="stage">
      <canvas id="film" width="720" height="1280" role="img" aria-label="無音32秒の構造図の動画。手順書3冊と依頼が同じ作者AIへ渡り、コマンドと予測値が別々に書かれ、制作担当がCADへ送る。CADの中で名前付きの値6つが式と3つの履歴を通って1つのボディになり、4つの値を変えると同じ履歴で計算し直される。予測と実測を照合し、JSON・STEP・STLとして保存され、保存結果ビューアで実際のPNGが開く。"></canvas>
    </div>
    <p class="caption" id="caption">無音32秒｜同じ図が動いて、SolidCraft に何を渡し、どう変わり、何が残るかを示します。図の「模式図」は説明用の絵、「実PNG」は元の制作で保存した画像です（各画像は個別に自動フィット）。</p>

    <div class="controls" id="controls">
      <div class="status-row">
        <p id="asset-status" data-state="loading" role="status" aria-live="polite">保存データ31件を確かめています</p>
        <p id="asset-dims"></p>
        <button type="button" id="retry" hidden>もう一度読み込む</button>
      </div>
      <div class="transport">
        <button type="button" id="play" aria-pressed="false" disabled>再生</button>
        <button type="button" id="reset" disabled>最初へ</button>
        <button type="button" id="replay" disabled>最初から再生</button>
        <button type="button" id="end" disabled>最後へ</button>
        <input type="range" id="time" min="0" max="32" step="0.1" value="31" aria-label="時刻（秒）" disabled>
        <output id="clock" for="time">31.0 / 32.0 秒</output>
      </div>
      <div class="jumps" role="group" aria-label="場面へ移動">
        <button type="button" data-jump="0" disabled>1 手順書と依頼</button>
        <button type="button" data-jump="4" disabled>2 作者と制作担当</button>
        <button type="button" data-jump="8" disabled>3 値→式→履歴→形</button>
        <button type="button" data-jump="14" disabled>4 4つの値を変える</button>
        <button type="button" data-jump="20" disabled>5 予測と実測</button>
        <button type="button" data-jump="26" disabled>6 3形式とビューア</button>
        <button type="button" data-jump="29" disabled>7 全体図</button>
      </div>
      <div class="orient" role="group" aria-label="画面の向き">
        <button type="button" data-orient="portrait" aria-pressed="true">縦 720×1280</button>
        <button type="button" data-orient="wide" aria-pressed="false">横 1280×720</button>
      </div>
      <p class="hint">プレビューです。書き出しでは、この操作の欄と説明文は表示しません。図は検証済みの保存データ（31ファイル）だけから描き、CAD・AI・寸法の再計算は動かしません。</p>
    </div>
  </main>
</body>
</html>
