<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>コードのつながりを、地図に。｜32秒・無音の概念図ムービー（編集ソース）</title>
<link rel="stylesheet" href="video.css">
<script src="video.js" defer></script>
</head>
<body>
<main class="player">
  <header class="film-head">
    <p class="film-kicker">Codebase Memory MCP 作例 · 編集ソース</p>
    <h1>コードのつながりを、地図に。<span class="film-meta">32秒 · 無音 · 保存済みの実行結果から描画</span></h1>
  </header>

  <div class="frame" id="frame">
    <canvas id="film" width="720" height="1280" role="img" aria-label="コードの束が手で回す索引の橋を渡って呼び出しの地図になり、submit_order の場所、並んだ3つの呼び出し先、変更後も古いままの地図、手で索引し直した後の新しい線、保存される実際の記録を1枚の図で描く32秒の無音ムービー。線は静的な呼び出しで、実行の流れではありません。"></canvas>
    <div class="film-error" id="film-error" role="alert" hidden>
      <p class="film-error-title">素材を確かめられなかったため、描画していません。</p>
      <p id="film-error-text"></p>
      <button type="button" id="film-retry" class="btn">読み込み直す</button>
    </div>
  </div>

  <section class="deck" id="deck" aria-label="プレビューの操作">
    <p class="status" id="status" role="status">素材（7ファイル）を確かめています…</p>
    <div class="row">
      <button type="button" class="btn btn--main" id="play" aria-pressed="false" disabled>再生</button>
      <button type="button" class="btn" id="reset" disabled>最初へ</button>
      <button type="button" class="btn" id="end" disabled>最後へ</button>
      <button type="button" class="btn" id="replay" disabled>もう一度再生</button>
    </div>
    <label class="scrub-label" for="scrub">位置 <output id="time" for="scrub">0.00 / 32.00 秒</output></label>
    <input type="range" id="scrub" min="0" max="32" step="0.0333333333" value="0" disabled>
    <div class="scenes" id="scenes" role="group" aria-label="場面へ移動"></div>
    <div class="row sizes" role="group" aria-label="画面の向き">
      <button type="button" class="btn" id="size-portrait" aria-pressed="true" disabled>縦 720×1280</button>
      <button type="button" class="btn" id="size-wide" aria-pressed="false" disabled>横 1280×720</button>
    </div>
    <p class="note" id="motion-note">一時停止の状態で開きます。音声・ナレーション・音声トラックはありません。</p>
    <p class="note"><a href="../index.html">作例ページへ戻る</a> · <a href="storyboard.json">storyboard.json</a> · <a href="README.md">README</a></p>
  </section>
</main>
</body>
</html>
