<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'"><title>工房のTODO | 期限の絞り込み作例</title><link rel="stylesheet" href="style.css"></head><body><main><p class="eyebrow">八百万図AIツールボックス / 合成データの作例</p><h1>工房のTODO</h1><p>このページの中だけで動きます。再読込すると合成データ6件に戻ります。</p><section aria-labelledby="list-title"><h2 id="list-title">やること</h2><div class="filters"><label>状態<select id="status"><option value="all">すべて</option><option value="open">未完了</option><option value="done">完了</option></select></label></div><p id="count" role="status" aria-live="polite"></p><p id="empty" hidden>該当するTODOはありません。</p><ul id="tasks" aria-label="TODO一覧"></ul></section><section aria-labelledby="add-title"><h2 id="add-title">TODOを追加</h2><form id="add-form"><label>名前<input id="title" maxlength="80" required></label><label>期限（任意）<input id="due" type="date" min="1000-01-01" max="9999-12-31"></label><button>追加する</button></form><p id="error" role="alert" hidden></p></section><p><a href="../../../case.html?id=addy-engineering-skills-example">作例の記事へ</a></p></main><script type="module" src="app.mjs"></script></body></html>
