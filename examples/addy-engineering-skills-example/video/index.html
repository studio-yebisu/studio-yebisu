<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
  <title>解説動画の編集ソース：TODOの期限の絞り込みを、仕様から先に作る</title>
  <link rel="stylesheet" href="scene.css">
</head>
<body>
  <div class="viewport" id="viewport">
    <div class="holder" id="holder">
      <div class="stage" id="stage" role="img" aria-label="解説動画：依頼と仕様で決めた3つの条件、状態「未完了」と期限2026-10-15で4件が2件になる保存結果、当日を含み翌日と期限なしを除く線の引き方、5回のテストの記録と比較を1か所反転したときの1件の失敗、持ち帰れる仕様・コード・テストを順に示す28秒の無音の映像。"></div>
    </div>
  </div>
  <div class="controls" id="controls" hidden>
    <button type="button" id="play" aria-pressed="false">再生</button>
    <input type="range" id="scrub" min="0" max="28" step="0.0333333" value="0" aria-label="時刻（秒）">
    <output id="time" for="scrub">0.00秒</output>
    <div class="chapters" role="group" aria-label="場面へ移動">
      <button type="button" data-at="0">1 依頼と仕様</button>
      <button type="button" data-at="4.5">2 4件から2件</button>
      <button type="button" data-at="11">3 線の引き方</button>
      <button type="button" data-at="17">4 テストの記録</button>
      <button type="button" data-at="22.5">5 持ち帰る</button>
    </div>
    <p class="hint">プレビューです。書き出しではこの欄を表示しません。名前・日付・件数・テストの数は <a href="../results.json">results.json</a>・<a href="../tdd-history.json">tdd-history.json</a>・<a href="../mutation.json">mutation.json</a> などの保存記録から読みます。<a href="../index.html">作例のページへ戻る</a></p>
  </div>
  <script src="scene.js"></script>
</body>
</html>
