    <h1>依頼文</h1>
    <p class="fiction">Design Taste の原典を固定コミットで読める環境で、AIに次の文章を渡します。【】の部分を自分の催しと条件に置き換えて使ってください。このページでAIを動かすことはありません。文章を選択してコピーしてください。</p>

    <textarea id="request-text" class="request-text" readonly rows="18" spellcheck="false">Design Taste（madebymustafa/design-taste、固定コミット c4a6bff0871eb4b15371b0e7d2751628b0ed4608）の skills/ にある design-taste・japanese-minimal・taste-accessibility・taste-typography・taste-ux-copy の5つの SKILL.md（https://github.com/madebymustafa/design-taste/tree/c4a6bff0871eb4b15371b0e7d2751628b0ed4608/skills）を読んでから、次の催し一覧のページを作ってください。

主催と利用者：【図書室や集会所などの名前、実在か架空か、主な利用者】
催しのデータ：【ファイル名と項目（名前・日付・開始と終了の時刻・対象・会場・説明・参加方法）、変えてはいけない項目】
絞り込み：【対象の分類と、検索に使う項目】
条件：【送信・予約・保存をするかどうか、使ってよい色・書体・素材】

進め方：最初に design read を一行で書き、スタイルは japanese-minimal の1つだけにする。紙・墨・印の赤、罫線の一覧、明朝とゴシック、縦書き1か所を使い、本文は16px以上、ラベルは14px以上にする。コントラストが4.5:1に届かない色は文字に使わず濃い色へ調整し、原典のどの指示を適用し、どれを調整したかを記録する。検索欄・select・details はネイティブの要素を使い、キーボードだけで操作できるようにする。0件のときは理由と解除の操作を出し、検索語をHTMLとして解釈しない。

確認：絞り込みの結果を期待する値と照らし、320px幅で日時・対象・参加方法が欠けないか、フォーカスが見えるか、文字のコントラストを実際のブラウザーで確かめる。確かめた点と、確かめていない点（スクリーンリーダー、人の承認など）を分けて報告する。</textarea>
