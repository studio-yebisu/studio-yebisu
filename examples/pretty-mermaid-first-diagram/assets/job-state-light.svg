<polyline class="edge" data-from="待機" data-to="実行中" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="開始" points="131.67083333333332,144.9 131.67083333333332,172.9 98.5,172.9 98.5,245.20000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
