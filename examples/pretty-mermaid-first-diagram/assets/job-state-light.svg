<g class="edge-label" data-from="待機" data-to="実行中" data-label="開始">
  <rect x="77.5" y="179.9" width="41.41" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
