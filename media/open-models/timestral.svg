<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" role="img" aria-labelledby="t d">
  <title id="t">模式図：Timestral-209M — 先の一日ごとに、一つの値ではなく分位点の段が返る</title>
  <desc id="d">目盛りの数値がないグラフ。左は過去の数値を結んだ黒い線。「いま」の縦の点線から右は、外側の薄い黄緑と内側の濃い黄緑の帯が先へ行くほど広がり、中央に朱色の中央値の線がある。右寄りの「この日」の縦線が帯を切り、上端の0.9（9割がこの下）、中央の0.5（中央値）、下端の0.1（1割がこの下）の三点に印が付く。外側の帯には21段の分位点と添えてある。グラフの下には過去から先まで続く既知の予定の帯があり、「いま」より右にも印がある。線と帯の形は説明用で、モデルが計算した値ではない。</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,"Noto Sans JP",sans-serif;font-weight:700;fill:#17150f}
    .tg{font-size:24px;fill:#f2eee3}
    .q{font-size:30px}
    .qs{font-size:22px;fill-opacity:0.75}
    .ld{stroke:#17150f;stroke-opacity:0.5;stroke-width:2}
  </style>
  <rect width="880" height="540" fill="#fbf9f3"/>
  <rect x="28" y="28" width="190" height="38" fill="#17150f"/>
  <text class="tg" x="123" y="55" text-anchor="middle">模式図・値なし</text>

  <!-- Axes without values -->
  <path d="M60 104 V380 H640" fill="none" stroke="#17150f" stroke-width="3" stroke-linecap="square"/>

  <!-- Quantile bands: outer (extreme quantiles) behind inner -->
  <path d="M420 232 C 500 205 580 150 640 122 L640 352 C 580 320 500 268 420 234 Z" fill="#cbef3a" opacity="0.4"/>
  <path d="M420 232 C 500 214 580 190 640 170 L640 300 C 580 286 500 258 420 233 Z" fill="#cbef3a"/>
  <path d="M420 232 C 500 236 580 236 640 234" fill="none" stroke="#ff4f00" stroke-width="5" stroke-linecap="round"/>
  <text x="660" y="132" style="font-size:24px">21段の分位点</text>

  <!-- Now -->
  <path d="M420 108 V380" stroke="#17150f" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="420" y="98" text-anchor="middle" style="font-size:28px">いま</text>

  <!-- History -->
  <polyline points="60,300 90,282 120,296 150,268 180,280 210,252 240,266 270,240 300,256 330,230 360,246 390,222 420,232" fill="none" stroke="#17150f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="420" cy="232" r="8" fill="#fbf9f3" stroke="#17150f" stroke-width="4"/>

  <!-- One future day, read as several quantiles -->
  <path d="M590 112 V380" stroke="#17150f" stroke-width="2.5"/>
  <text x="590" y="98" text-anchor="middle" style="font-size:24px">この日</text>
  <path class="ld" d="M598 186 H654 M598 235 H654 M598 287 H654"/>
  <circle cx="590" cy="186" r="7" fill="#17150f"/>
  <circle cx="590" cy="235" r="8" fill="#ff4f00" stroke="#17150f" stroke-width="2"/>
  <circle cx="590" cy="287" r="7" fill="#17150f"/>
  <text class="q" x="660" y="196">0.9</text>
  <text class="qs" x="716" y="194">9割がこの下</text>
  <text class="q" x="660" y="246" style="fill:#ff4f00">0.5</text>
  <text x="716" y="245" style="font-size:26px;fill:#ff4f00">中央値</text>
  <text class="q" x="660" y="298">0.1</text>
  <text class="qs" x="716" y="296">1割がこの下</text>

  <text x="240" y="418" text-anchor="middle" style="font-size:30px">過去</text>
  <text x="530" y="418" text-anchor="middle" style="font-size:30px">予測</text>

  <!-- Known future covariates -->
  <rect x="60" y="438" width="580" height="34" fill="#f2eee3" stroke="#17150f" stroke-width="2"/>
  <path d="M420 434 V476" stroke="#17150f" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="122" y="446" width="18" height="18" fill="#17150f"/>
  <rect x="290" y="446" width="18" height="18" fill="#17150f"/>
  <rect x="496" y="446" width="18" height="18" fill="#ff4f00"/>
  <rect x="604" y="446" width="18" height="18" fill="#ff4f00"/>
  <text x="660" y="464" style="font-size:24px">既知の予定</text>
  <text x="60" y="508" style="font-size:22px;fill-opacity:0.75">休日など、先まで分かっている情報も渡せる</text>
</svg>
